<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>DeepSeek 后台管理</title>
<!-- 图标走站点根路径；deepseek 与 api 两个域名都配了同名文件，所以这里用根相对路径 -->
<!-- PNG 放最前：比 ico 清晰，也避开 CDN 上 favicon.ico 的旧缓存 -->
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="icon" href="/favicon.ico">
<meta name="theme-color" content="#0f1115">
<style>
  :root{
    --bg:#0f1115; --panel:#171a21; --panel2:#1d212a; --line:#262b36;
    --text:#e8eaed; --sub:#8b93a1; --brand:#4d6bfe; --brand2:#7c8fff;
    --ok:#2ecc71; --warn:#f5a623; --err:#ff5d5d;
  }
  @media (prefers-color-scheme: light){
    :root{
      --bg:#f4f6fa; --panel:#ffffff; --panel2:#f7f8fb; --line:#e3e7ef;
      --text:#1a1d24; --sub:#6b7280; --brand:#4d6bfe; --brand2:#3355f0;
    }
  }
  *{box-sizing:border-box}
  body{
    margin:0;background:var(--bg);color:var(--text);
    font:14px/1.55 -apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;
  }
  a{color:var(--brand);text-decoration:none}
  button{
    font:inherit;cursor:pointer;border:0;border-radius:9px;padding:8px 14px;
    background:var(--panel2);color:var(--text);transition:.15s;
  }
  button:hover{filter:brightness(1.1)}
  button.primary{background:var(--brand);color:#fff}
  button.danger{background:transparent;color:var(--err);border:1px solid var(--line)}
  button.danger:hover{border-color:var(--err)}
  button:disabled{opacity:.5;cursor:default}
  input{
    font:inherit;background:var(--panel2);border:1px solid var(--line);color:var(--text);
    border-radius:9px;padding:8px 12px;outline:none;
  }
  input:focus{border-color:var(--brand)}
  .hide{display:none!important}

  /* 登录层 */
  #gate{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:var(--bg);z-index:50;padding:24px}
  #gate .box{width:100%;max-width:340px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:22px}
  #gate h1{font-size:17px;margin:0 0 4px}
  #gate p{color:var(--sub);font-size:13px;margin:0 0 18px}
  #gate input{width:100%;margin-bottom:12px}
  #gate button{width:100%}
  #gate .err{color:var(--err);font-size:13px;min-height:18px;margin-top:10px}

  /* 布局 */
  .app{display:flex;min-height:100vh}
  aside{
    width:210px;flex:0 0 210px;background:var(--panel);border-right:1px solid var(--line);
    padding:18px 12px;position:sticky;top:0;height:100vh;display:flex;flex-direction:column;
  }
  aside .logo{font-weight:700;font-size:15px;padding:0 10px 18px;display:flex;align-items:center;gap:8px}
  aside .logo i{width:9px;height:9px;border-radius:50%;background:var(--brand);display:block}
  aside nav a{
    display:block;padding:9px 12px;border-radius:9px;color:var(--sub);font-size:14px;margin-bottom:2px
  }
  aside nav a.on{background:var(--panel2);color:var(--text);font-weight:600}
  aside .foot{margin-top:auto;font-size:12px;color:var(--sub);padding:12px 10px 0}
  main{flex:1;min-width:0;padding:20px 24px 60px;overflow-x:hidden}
  .head{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:18px;flex-wrap:wrap}
  .head h2{font-size:19px;margin:0}
  .head .meta{color:var(--sub);font-size:13px}

  /* 卡片 */
  /* 6 张卡片：宽屏固定 6 列不折行，窄屏自动降为 3/2 列 */
  .cards{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;margin-bottom:16px}
  @media (max-width:1400px){.cards{grid-template-columns:repeat(3,1fr)}}
  @media (max-width:720px){.cards{grid-template-columns:repeat(2,1fr)}}
  .card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px}
  .card .k{color:var(--sub);font-size:12px;margin-bottom:6px;display:flex;justify-content:space-between}
  .card .v{font-size:24px;font-weight:700;letter-spacing:-.5px;font-variant-numeric:tabular-nums}
  .card .s{color:var(--sub);font-size:12px;margin-top:4px}
  .card .badge{background:var(--panel2);border-radius:99px;padding:1px 7px;font-size:11px}

  .panel{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
  .panel h3{font-size:14px;margin:0 0 12px;display:flex;justify-content:space-between;align-items:center}
  .panel h3 .sub{color:var(--sub);font-weight:400;font-size:12px}
  .cols{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  @media (max-width:1000px){.cols{grid-template-columns:1fr}}

  /* 表格 */
  .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:9px 10px;border-bottom:1px solid var(--line);white-space:nowrap}
  th{color:var(--sub);font-weight:500;font-size:12px;position:sticky;top:0;background:var(--panel)}
  tbody tr:hover{background:var(--panel2)}
  td.num{text-align:right;font-variant-numeric:tabular-nums}
  td.wrap{white-space:normal;max-width:340px;overflow-wrap:anywhere}
.empty{color:var(--sub);text-align:center;padding:26px 0;font-size:13px}
  /* 用户画像：给一块与面板同色的底，长文也能读；不加边框 */
  .profile{white-space:pre-wrap;word-break:break-word;font-size:13px;line-height:1.7;
    background:var(--panel2);border-radius:10px;padding:12px 14px;max-height:260px;overflow:auto}
  .hint{color:var(--sub);font-size:12px;margin-top:6px}
  .tag{display:inline-block;margin-left:8px;padding:1px 8px;border-radius:999px;
    font-size:11px;font-weight:400;background:var(--panel2);color:var(--sub)}
  .tag.ok{background:rgba(46,204,113,.16);color:var(--ok)}

  /* 图表 */
  .chart{width:100%;height:170px;display:block}
  .legend{display:flex;gap:16px;font-size:12px;color:var(--sub);margin-top:8px;flex-wrap:wrap}
  .legend i{width:9px;height:9px;border-radius:2px;display:inline-block;margin-right:5px}

  /* 条形排行 */
  .rank{display:flex;flex-direction:column;gap:9px}
  .rank .row{display:grid;grid-template-columns:1fr auto;gap:10px;font-size:13px;align-items:center}
  .rank .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;position:relative;z-index:1}
  .rank .bar{position:relative;height:22px;border-radius:6px;background:var(--panel2);overflow:hidden}
  .rank .bar>i{position:absolute;inset:0 auto 0 0;background:linear-gradient(90deg,var(--brand),var(--brand2));opacity:.35;border-radius:6px}
  .rank .bar>span{position:absolute;inset:0;padding:0 8px;display:flex;align-items:center;justify-content:space-between;font-size:12px}

  /* 分页 */
  .pager{display:flex;gap:8px;align-items:center;justify-content:flex-end;margin-top:12px;font-size:13px;color:var(--sub)}
  .pager button{padding:5px 11px;font-size:13px}

  /* 弹窗 */
  #modal{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;z-index:60;padding:20px}
  #modal .box{background:var(--panel);border:1px solid var(--line);border-radius:16px;width:100%;max-width:760px;max-height:86vh;display:flex;flex-direction:column}
  #modal .box .h{padding:14px 18px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}
  #modal .box .h b{font-size:15px}
  #modal .box .b{padding:16px 18px;overflow:auto}
  #modal .box .f{padding:12px 18px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
  .pill{display:inline-block;margin-left:6px;padding:1px 7px;border-radius:99px;font-size:11px;line-height:1.6;background:var(--panel2);color:var(--sub);vertical-align:1px}
  .pill.warn{color:var(--warn)}
  .pill.err{color:var(--err)}
  .msg{padding:9px 12px;border-radius:9px;margin-bottom:9px;font-size:13px;white-space:pre-wrap;overflow-wrap:anywhere}
  .msg.user{background:var(--panel2)}
  .msg.assistant{border-left:3px solid var(--brand)}
  .msg .who{color:var(--sub);font-size:11px;margin-bottom:4px}
  .msg .ver{display:inline-flex;align-items:center;gap:4px;margin-left:8px;padding:1px 4px;
    border-radius:7px;background:var(--brand);color:#fff;font-size:10px;vertical-align:middle}
  .msg .ver b{font-weight:600;letter-spacing:.5px}
  .msg .vnav{padding:0 5px;border-radius:5px;background:rgba(255,255,255,.22);
    color:#fff;font-size:11px;line-height:15px;min-width:16px}
  .msg .vnav:hover{background:rgba(255,255,255,.4)}
  /* 非当前分支的消息压暗，一眼分清哪些是「当前生效」的那条 */
  .msg.off{opacity:.55}
  .msg-empty{color:var(--sub);font-style:italic}
  /* Markdown 正文：管理页是暗色/浅色双主题，全部用变量取色 */
  .md{font-size:13px;line-height:1.75}
  .md > *:first-child{margin-top:0}
  .md > *:last-child{margin-bottom:0}
  .md h1,.md h2,.md h3,.md h4,.md h5,.md h6{margin:14px 0 8px;line-height:1.35;font-weight:700}
  .md h1{font-size:1.25em}
  .md h2{font-size:1.15em}
  .md h3{font-size:1.06em}
  .md h4,.md h5,.md h6{font-size:1em;color:var(--sub)}
  .md p{margin:8px 0}
  .md ul,.md ol{margin:8px 0;padding-left:1.6em}
  .md li{margin:3px 0}
  .md li::marker{color:var(--brand2)}
  .md blockquote{margin:10px 0;padding:6px 12px;border-left:3px solid var(--brand);
    background:var(--panel2);border-radius:0 8px 8px 0;color:var(--sub)}
  .md code{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.92em;
    background:var(--panel2);padding:1px 5px;border-radius:5px}
  .md pre{margin:10px 0;padding:11px 13px;background:var(--panel2);border-radius:10px;overflow:auto}
  .md pre code{background:none;padding:0;font-size:.9em;line-height:1.6}
  .md table{border-collapse:collapse;margin:10px 0;font-size:.94em;display:block;overflow:auto}
  .md th,.md td{border:1px solid var(--line);padding:5px 9px;text-align:left}
  .md th{background:var(--panel2);font-weight:700}
  .md hr{border:0;border-top:1px solid var(--line);margin:14px 0}
  .md a{color:var(--brand2);text-decoration:underline}
  .md img{max-width:100%;border-radius:8px}
  .md strong{font-weight:700;color:var(--text)}
  /* 图片预览层：附件接口统一返回 octet-stream，直接开新窗口会变成下载，
     所以在页面内放大看 */
  #lightbox{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.82);
    display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;cursor:zoom-out;padding:24px}
  #lightbox img{max-width:92vw;max-height:86vh;border-radius:12px;box-shadow:0 18px 48px rgba(0,0,0,.5)}
  #lightbox .lb-hint{color:#9aa3b2;font-size:12px}
  /* 附件：图片缩略图 + 文件条，和消息块同样的填充色层级，不加边框 */
  .atts{margin-top:8px;display:flex;flex-direction:column;gap:8px}
  .att-imgs{display:flex;flex-wrap:wrap;gap:8px}
  .att-img{display:block;line-height:0;border-radius:10px;overflow:hidden;
    background:var(--panel2);transition:transform .15s}
  .att-img img{max-width:190px;max-height:190px;object-fit:cover;display:block}
  .att-img:hover{transform:translateY(-2px)}
  .att-file{display:inline-flex;align-items:center;gap:8px;align-self:flex-start;
    padding:6px 10px;border-radius:9px;background:var(--panel2);color:var(--text);
    font-size:12px;text-decoration:none;max-width:100%}
  .att-file:hover{filter:brightness(1.15)}
  .att-ext{background:var(--brand);color:#fff;border-radius:5px;padding:1px 5px;
    font-size:10px;font-weight:700;flex-shrink:0}
  .att-name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .att-size{color:var(--sub);flex-shrink:0}
  .branchhint{color:var(--sub);font-size:12px;margin-bottom:10px;padding:7px 10px;
    background:var(--panel2);border-radius:8px;line-height:1.5}
  .kv{display:grid;grid-template-columns:auto 1fr;gap:6px 14px;font-size:13px;margin-bottom:14px}
  .kv .k{color:var(--sub)}
  .toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--panel);border:1px solid var(--line);
    color:var(--text);padding:10px 18px;border-radius:11px;font-size:13px;z-index:99;box-shadow:0 8px 26px rgba(0,0,0,.28)}
</style>
</head>
<body>

<!-- 令牌输入层 -->
<div id="gate">
  <div class="box">
    <h1>后台管理</h1>
    <p>输入服务端配置的 <code>CHAT_ADMIN_TOKEN</code></p>
    <input id="gate-token" type="password" placeholder="管理令牌" autocomplete="current-password">
    <button class="primary" id="gate-go">进入</button>
    <div class="err" id="gate-err"></div>
  </div>
</div>

<div class="app hide" id="app">
  <aside>
    <div class="logo"><i></i>DeepSeek 后台</div>
    <nav id="nav">
      <a href="dashboard" data-v="dashboard">仪表盘</a>
      <a href="users" data-v="users">用户</a>
      <a href="conversations" data-v="conversations">对话</a>
      <a href="usage" data-v="usage">Token 消耗</a>
      <a href="shares" data-v="shares">分享</a>
    </nav>
    <div class="foot">
      <div id="foot-info">—</div>
      <div style="margin-top:8px"><a href="#" id="logout">退出</a></div>
    </div>
  </aside>
  <main id="main"></main>
</div>

<div id="lightbox" class="hide"><img id="lightbox-img" alt="附件"><div class="lb-hint">点击任意处关闭</div></div>

<div id="modal" class="hide"><div class="box">
  <div class="h"><b id="modal-title"></b><button id="modal-x">关闭</button></div>
  <div class="b" id="modal-body"></div>
  <div class="f" id="modal-foot"></div>
</div></div>

</script>
<script>
(function () {
  'use strict';

  var TOKEN_KEY = 'dsh-admin-token';
  var state = { view: 'dashboard', token: '', days: 30, page: 1, size: 20, q: '', sort: 'seen', convActive: [], convMd: true };

  var $ = function (s, r) { return (r || document).querySelector(s); };
  var $$ = function (s, r) { return Array.prototype.slice.call((r || document).querySelectorAll(s)); };

  // ---------------------------------------------------------------- 工具

  function esc(s) {
    return String(s == null ? '' : s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  function num(n) {
    n = Number(n) || 0;
    if (n >= 1e8) return (n / 1e8).toFixed(2) + '亿';
    if (n >= 1e4) return (n / 1e4).toFixed(n >= 1e5 ? 0 : 1) + '万';
    return n.toLocaleString('zh-CN');
  }

  function fmtTime(ts) {
    if (!ts) return '—';
    var d = new Date(Number(ts) * 1000);
    var p = function (x) { return x < 10 ? '0' + x : '' + x; };
    return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) + ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function ago(ts) {
    if (!ts) return '—';
    var s = Math.floor(Date.now() / 1000 - Number(ts));
    if (s < 60) return '刚刚';
    if (s < 3600) return Math.floor(s / 60) + ' 分钟前';
    if (s < 86400) return Math.floor(s / 3600) + ' 小时前';
    if (s < 86400 * 30) return Math.floor(s / 86400) + ' 天前';
    return fmtTime(ts);
  }

  function toast(text) {
    var el = document.createElement('div');
    el.className = 'toast';
    el.textContent = text;
    document.body.appendChild(el);
    setTimeout(function () { el.remove(); }, 2200);
  }

  // fetch 统一封装：401 就退回令牌输入层
  function api(path) {
    var opt = { headers: { Authorization: 'Bearer ' + state.token } };
    if (arguments.length > 1 && arguments[1]) {
      opt.method = arguments[1];
      if (arguments[2]) {
        opt.headers['Content-Type'] = 'application/json';
        opt.body = JSON.stringify(arguments[2]);
      }
    }
    // 页面在 chat.example.com，接口在 api.example.com（跨域，靠服务端 CORS 放行）。
    // 不能用相对路径：页面与接口不同源，相对路径会打到页面域名上。
    return fetch(API_ORIGIN + path, opt).then(function (r) {
      return r.json().catch(function () { return {}; }).then(function (d) {
        if (r.status === 401) { lockGate('令牌无效或已更换'); throw new Error('unauthorized'); }
        if (r.status === 503) { lockGate(d.error || '后台未开启'); throw new Error('disabled'); }
        if (!r.ok) throw new Error(d.error || ('HTTP ' + r.status));
        return d;
      });
    });
  }

  // ---------------------------------------------------------------- 登录层

  function lockGate(msg) {
    $('#app').classList.add('hide');
    $('#gate').classList.remove('hide');
    $('#gate-err').textContent = msg || '';
    state.token = '';
    try { localStorage.removeItem(TOKEN_KEY); } catch (e) {}
  }

  function unlockGate(token) {
    state.token = token;
    try { localStorage.setItem(TOKEN_KEY, token); } catch (e) {}
    $('#gate').classList.add('hide');
    $('#app').classList.remove('hide');
    render();
  }

  $('#gate-go').onclick = function () {
    var v = $('#gate-token').value.trim();
    if (!v) { $('#gate-err').textContent = '请输入令牌'; return; }
    $('#gate-err').textContent = '';
    state.token = v;
    api('/overview?days=7').then(function () {
      unlockGate(v);
    }).catch(function (e) {
      if (e.message !== 'unauthorized' && e.message !== 'disabled') {
        $('#gate-err').textContent = e.message;
      }
    });
  };
  $('#gate-token').onkeydown = function (e) { if (e.key === 'Enter') $('#gate-go').click(); };

  $('#logout').onclick = function (e) { e.preventDefault(); lockGate(''); };

  // ---------------------------------------------------------------- 路由

  // 接口域名：后台页面放 chat.example.com，接口统一在 api.example.com。
  // 页面与接口不同源，跨域请求由服务端的 withCORS 放行（回显 Origin）。
  var API_ORIGIN = window.__ADMIN_API_ORIGIN__ || (location.origin + '/admin/api');

  // 真路径路由：/admin/users 直接落到 users 视图（刷新、分享链接都成立）。
  // 取 /admin/ 之后的那一段，认不出就回仪表盘。
  var VIEWS = ['dashboard', 'users', 'conversations', 'usage', 'shares'];

  // 把 pathname 拆成「页面前缀 + 视图」两段，两处共用同一份解析，避免各算各的。
  // 前缀以最后一个 /admin 段为界：/chat/admin/users -> 前缀 /chat/admin/，视图 users。
  function splitPath() {
    var p = location.pathname.replace(/\/index\.html$/, '/');
    var m = p.match(/^(.*?\/admin)\/(.*)$/);
    if (!m) return { base: p.charAt(p.length - 1) === '/' ? p : p + '/', view: 'dashboard' };
    return { base: m[1] + '/', view: m[2].replace(/\/+$/, '') };
  }

  // 页面前缀（接口基址与站内跳转都用它）
  // 不能直接拿 pathname 归一：在 /admin/users 下再点导航会叠成 /admin/users/conversations，
  // 接口也会打到 /admin/users/api/... 上去。
  function basePath() { return splitPath().base; }

  function currentView() {
    var v = splitPath().view;
    return VIEWS.indexOf(v) >= 0 ? v : 'dashboard';
  }

  // 站内跳转一律用 pushState，避免整页刷新
  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('#nav a') : null;
    if (!a) return;
    e.preventDefault();
    var v = a.getAttribute('data-v');
    if (v === state.view) return;
    history.pushState({}, '', basePath() + v);
    state.view = v;
    state.page = 1;
    render();
  });

  window.addEventListener('popstate', function () {
    state.view = currentView();
    state.page = 1;
    render();
  });

  function setNav() {
    $$('#nav a').forEach(function (a) {
      a.classList.toggle('on', a.getAttribute('data-v') === state.view);
    });
  }

  function render() {
    if (!state.token) return;
    setNav();
    var fn = { dashboard: viewDashboard, users: viewUsers, conversations: viewConversations, usage: viewUsage, shares: viewShares }[state.view];
    $('#main').innerHTML = '<div class="empty">加载中…</div>';
    fn().catch(function (e) {
      if (e.message === 'unauthorized' || e.message === 'disabled') return;
      $('#main').innerHTML = '<div class="panel"><div class="empty">加载失败：' + esc(e.message) + '</div></div>';
    });
  }

  // ---------------------------------------------------------------- 折线/柱状图（手绘 SVG，不引第三方库）

  function lineChart(series, opts) {
    opts = opts || {};
    var W = 100, H = 100;
    var n = series.length;
    if (!n) return '<div class="empty">暂无数据</div>';

    var keys = opts.keys, colors = opts.colors, names = opts.names;
    // 取所有序列的最大值作为纵轴上限
    var max = 0;
    keys.forEach(function (k) {
      series.forEach(function (p) { if (Number(p[k]) > max) max = Number(p[k]); });
    });
    if (max <= 0) max = 1;

    var pad = 2;
    var stepX = n > 1 ? (W - pad * 2) / (n - 1) : 0;
    var path = function (k) {
      var d = '';
      series.forEach(function (p, i) {
        var x = pad + stepX * i;
        var y = H - pad - (Number(p[k]) / max) * (H - pad * 2);
        d += (i === 0 ? 'M' : 'L') + x.toFixed(2) + ' ' + y.toFixed(2) + ' ';
      });
      return d.trim();
    };
    var area = function (k) {
      var d = path(k);
      if (!d) return '';
      var lastX = pad + stepX * (n - 1);
      return d + ' L' + lastX.toFixed(2) + ' ' + (H - pad) + ' L' + pad + ' ' + (H - pad) + ' Z';
    };

    var svg = '<svg class="chart" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">';
    // 横向参考线
    [0, 0.25, 0.5, 0.75, 1].forEach(function (r) {
      var y = H - pad - r * (H - pad * 2);
      svg += '<line x1="0" y1="' + y.toFixed(2) + '" x2="' + W + '" y2="' + y.toFixed(2) +
        '" stroke="var(--line)" stroke-width="0.3" vector-effect="non-scaling-stroke"/>';
    });
    keys.forEach(function (k, i) {
      svg += '<path d="' + area(k) + '" fill="' + colors[i] + '" opacity="0.10"/>';
      svg += '<path d="' + path(k) + '" fill="none" stroke="' + colors[i] +
        '" stroke-width="2" vector-effect="non-scaling-stroke" stroke-linejoin="round"/>';
    });
    svg += '</svg>';

    var legend = keys.map(function (k, i) {
      var total = series.reduce(function (a, p) { return a + Number(p[k] || 0); }, 0);
      return '<span><i style="background:' + colors[i] + '"></i>' + esc(names[i]) + ' ' + num(total) + '</span>';
    }).join('');

    var axis = '<div style="display:flex;justify-content:space-between;color:var(--sub);font-size:11px;margin-top:4px">' +
      '<span>' + esc(series[0].date) + '</span><span>峰值 ' + num(max) + '</span><span>' +
      esc(series[n - 1].date) + '</span></div>';

    return svg + axis + '<div class="legend">' + legend + '</div>';
  }

  function rankList(items, labelKey, valueKey, fmt) {
    if (!items || !items.length) return '<div class="empty">暂无数据</div>';
    var max = 0;
    items.forEach(function (it) { if (Number(it[valueKey]) > max) max = Number(it[valueKey]); });
    if (max <= 0) max = 1;
    return '<div class="rank">' + items.map(function (it) {
      var pct = Math.max(2, (Number(it[valueKey]) / max) * 100);
      // 匿名用户没有邮箱，用 id 末尾几位代替，不显示成「（空）」
      var label = it[labelKey] || ('匿名 ' + String(it.id || '').slice(-8));
		return '<div class="row"><div class="bar"><i style="width:' + pct + '%"></i>' +
        '<span><b class="name">' + esc(label) + '</b><b>' + fmt(it[valueKey]) + '</b></span></div></div>';
    }).join('') + '</div>';
  }

  // ---------------------------------------------------------------- 仪表盘

  function viewDashboard() {
    return api('/overview?days=' + state.days).then(function (d) {
      var u = d.users, t = d.tokens, c = d.conversations, m = d.messages;

      var cards = '<div class="cards">' +
        card('用户总数', num(u.total), '近 7 天新增 ' + num(u.new) + ' · 已验证 ' + num(u.verified)) +
        card('活跃用户', num(u.active7d), '近 7 天有对话 · 禁用 ' + num(u.disabled)) +
        card('会话总数', num(c.total), '今日新增 ' + num(c.new)) +
        card('消息总数', num(m.total), '今日新增 ' + num(m.new)) +
        card('Token 总消耗', num(t.total), '输入 ' + num(t.in) + ' · 输出 ' + num(t.out)) +
        card('今日 Token', num(t.today_in + t.today_out), '输入 ' + num(t.today_in) + ' · 输出 ' + num(t.today_out)) +
        '</div>';

      var chart = '<div class="panel"><h3>Token 消耗趋势 <span class="sub">近 ' + state.days + ' 天</span></h3>' +
        lineChart(d.series, {
          keys: ['tokens_in', 'tokens_out'],
          colors: ['#4d6bfe', '#2ecc71'],
          names: ['输入', '输出']
        }) + '</div>';

      var chart2 = '<div class="panel"><h3>消息与会话 <span class="sub">近 ' + state.days + ' 天</span></h3>' +

  // 分支视图：同一父节点下有多条消息，就是「重新生成」产生的多个版本。
  // 默认只渲染一条链（根 → 叶子），带版本的消息给 ‹ n/m › 可切换；
  // 切到别的版本后，下面继续按「优先跟随当前分支」往下走，形成完整的一条链。
  // 「显示全部分支」可展开整棵树，非当前分支的压暗。
  function convTree() {
    var c = state.convData || {};
    var nodes = c.tree && c.tree.length ? c.tree : (c.messages || []);
    var kids = {};
    nodes.forEach(function (n) {
      var k = n.parent_id == null ? 'root' : String(n.parent_id);
      (kids[k] = kids[k] || []).push(n);
    });
    return { nodes: nodes, kids: kids };
  }

  // Markdown 渲染：marked 解析 + DOMPurify 净化。
  // 必须净化：正文是模型输出经用户收藏后落库的，可能夹带 HTML；管理页的
  // 令牌在 localStorage，innerHTML 直接插原始 HTML 等于把令牌送给任何 XSS。
  // breaks 必须关：开了之后单个换行会变成 <br>，把 $$ ... $$ 公式块切碎，
  // KaTeX 拿到的是被 <br> 分隔的多个文本节点，匹配不到跨行的公式。
  marked.setOptions({ gfm: true, breaks: false });

  // 公式：KaTeX 走 CDN 懒加载（整套字体上 MB，内嵌进二进制不划算）。
  // 加载失败就保持源码显示，不影响其余渲染。
  var katexState = 0; // 0 未加载，1 加载中，2 可用，3 失败
  var katexQueue = [];
  function ensureKatex(cb) {
    if (katexState === 2) { cb(); return; }
    if (katexState === 3) { return; }
    katexQueue.push(cb);
    if (katexState === 1) { return; }
    katexState = 1;
    var link = document.createElement('link');
    link.rel = 'stylesheet';
    link.href = 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.css';
    document.head.appendChild(link);
    var s1 = document.createElement('script');
    s1.src = 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/katex.min.js';
    s1.onload = function () {
      var s2 = document.createElement('script');
      s2.src = 'https://cdn.jsdelivr.net/npm/katex@0.16.11/dist/contrib/auto-render.min.js';
      s2.onload = function () { katexState = 2; katexQueue.splice(0).forEach(function (f) { f(); }); };
      s2.onerror = function () { katexState = 3; katexQueue = []; };
      document.head.appendChild(s2);
    };
    s1.onerror = function () { katexState = 3; katexQueue = []; };
    document.head.appendChild(s1);
  }

  // 把已经插进 DOM 的公式节点渲染掉（在 paint 之后调用，避免和重绘打架）
  function renderMathIn(box) {
    if (!box || !window.renderMathInElement) {
      return;
    }
    try {
      window.renderMathInElement(box, {
        delimiters: [
          { left: '$$', right: '$$', display: true },
          { left: '\\[', right: '\\]', display: true },
          { left: '\\(', right: '\\)', display: false },
          { left: '$', right: '$', display: false }
        ],
        // 代码块里的 $ 不能当公式
        ignoredTags: ['pre', 'code', 'script', 'style', 'textarea'],
        throwOnError: false
      });
    } catch (e) {
      // 公式坏了不能拖累整段正文
    }
  }

  // Markdown 会把 \[ \] \( \) 当转义吃掉（\[ -> [），导致 KaTeX 的定界符在
  // 解析后已经不存在。这里在解析前统一换成 $$ / $；跳过代码块，别把代码里的
  // 反斜杠也改掉。
  function normalizeMathDelims(src) {
    var parts = String(src == null ? '' : src).split(/(```[\s\S]*?```)/g);
    for (var i = 0; i < parts.length; i++) {
      if (i % 2 === 1) {
        continue; // 奇数项是代码块，原样保留
      }
      // 用函数替换：String.replace 里 '$$' 表示一个字面 $，会少一层
      parts[i] = parts[i]
        .replace(/\\\[/g, function () { return '$$'; })
        .replace(/\\\]/g, function () { return '$$'; })
        .replace(/\\\(/g, function () { return '$'; })
        .replace(/\\\)/g, function () { return '$'; });
    }
    return parts.join('');
  }

  function renderMarkdown(src) {
    var html = marked.parse(normalizeMathDelims(src));
    html = DOMPurify.sanitize(html, { USE_PROFILES: { html: true } });
    // 净化后统一处理外链：新窗口打开，避免把管理页跳走
    var box = document.createElement('div');
    box.innerHTML = html;
    Array.prototype.forEach.call(box.querySelectorAll('a[href]'), function (a) {
      a.setAttribute('target', '_blank');
      a.setAttribute('rel', 'noopener noreferrer');
    });
    return box.innerHTML;
  }

  // 附件地址：附件走 /chat/v1/files/{id}（匿名可取，见 handleFileDownload）
  var FILE_BASE = (window.__ADMIN_API_ORIGIN__ ? window.__ADMIN_API_ORIGIN__.replace(/\/admin\/api$/,'') : location.origin) + '/chat/v1/files/';

  function fmtSize(n) {
    if (!n) return '';
    if (n < 1024) return n + ' B';
    if (n < 1024 * 1024) return (n / 1024).toFixed(0) + ' KB';
    return (n / 1024 / 1024).toFixed(1) + ' MB';
  }

  // 附件：图片给缩略图（点开新窗口看原图），其余给文件名+大小。
  // 客户端把图片放在 files 里、正文留空，所以「空正文」不等于空消息。
  function convFilesHtml(files) {
    if (!files || !files.length) {
      return '';
    }
    var imgs = '', docs = '';
    files.forEach(function (f) {
      if (!f || !f.id) return;
      var url = FILE_BASE + encodeURIComponent(f.id);
      if (f.isImage) {
        imgs += '<a class="att-img" href="' + url + '" target="_blank" rel="noopener" title="' +
          esc(f.name || '') + '">' +
          '<img src="' + url + '" alt="' + esc(f.name || '图片') + '" loading="lazy"></a>';
      } else {
        docs += '<a class="att-file" href="' + url + '" target="_blank" rel="noopener">' +
          '<span class="att-ext">' + esc((f.name || '').split('.').pop().slice(0, 4).toUpperCase() || 'FILE') + '</span>' +
          '<span class="att-name">' + esc(f.name || f.id) + '</span>' +
          (f.size ? '<span class="att-size">' + fmtSize(f.size) + '</span>' : '') + '</a>';
      }
    });
    if (!imgs && !docs) {
      return '';
    }
    return '<div class="atts">' + (imgs ? '<div class="att-imgs">' + imgs + '</div>' : '') + docs + '</div>';
  }

  function convMsgHtml(node, verHtml, dimmed) {
    var atts = convFilesHtml(node.files);
    // 空正文（上游断流时可能留下空 assistant）要显式标出来，
    // 否则弹窗里是一个空白块，排查时容易误以为是前端没渲染出来。
    // 但带附件的消息不算空 —— 客户端的图片消息就是「正文空 + files 有内容」。
    var body;
    if (!node.content || !node.content.length) {
      body = atts ? '' : '<span class="msg-empty">（空消息）</span>';
    } else if (state.convMd) {
      // 截断的消息可能把代码块切断，补一个结束围栏，免得后面整段被吞进 <pre>
      var src = node.content;
      var fences = (src.match(/^```/gm) || []).length;
      if (node.truncated && fences % 2 === 1) {
        src += '\n```';
      }
      body = '<div class="md">' + renderMarkdown(src) + '</div>';
    } else {
      body = esc(node.content);
    }
    return '<div class="msg ' + (node.role === 'user' ? 'user' : 'assistant') +
      (dimmed ? ' off' : '') + '">' +
      '<div class="who">' + (node.role === 'user' ? '用户' : '助手') + ' · ' + fmtTime(node.created_at) +
      (node.stop_reason ? ' · ' + esc(node.stop_reason) : '') +
      (node.truncated ? ' · 已截断' : '') + (verHtml || '') + '</div>' +
      body + atts + '</div>';
  }

  // 一条链：从 root 往下，每层取「用户选过的版本」→「当前分支上的」→「第一条」
  function renderBranchPath(tree) {
    var activeIds = {};
    (state.convActive || []).forEach(function (id) { activeIds[id] = true; });
    var pick = state.convPick || {};
    var html = '', key = 'root', guard = 0;
    while (guard++ < 500) {
      var peers = tree.kids[key] || [];
      if (!peers.length) {
        break;
      }
      var chosen = null, idx = 0;
      for (var i = 0; i < peers.length; i++) {
        if (pick[key] != null && String(peers[i].id) === String(pick[key])) { chosen = peers[i]; idx = i; break; }
      }
      if (!chosen) {
        for (var j = 0; j < peers.length; j++) {
          if (activeIds[peers[j].id]) { chosen = peers[j]; idx = j; break; }
        }
      }
      if (!chosen) { chosen = peers[0]; idx = 0; }

      var verHtml = '';
      if (peers.length > 1) {
        verHtml = '<span class="ver">' +
          (idx > 0 ? '<button class="vnav" data-pk="' + esc(key) + '" data-i="' + idx + '" data-d="' + (-1) + '" title="上一版本">‹</button>' : '') +
          '<b>' + (idx + 1) + '/' + peers.length + '</b>' +
          (idx + 1 < peers.length ? '<button class="vnav" data-pk="' + esc(key) + '" data-i="' + idx + '" data-d="1" title="下一版本">›</button>' : '') +
          '</span>';
      }
      html += convMsgHtml(chosen, verHtml, false);
      key = String(chosen.id);
    }
    return html || '<div class="empty">没有消息</div>';
  }

  // 整棵树：所有分支都铺开，不在当前分支上的压暗（排查全貌用）
  function renderBranchAll(tree) {
    var activeIds = {};
    (state.convActive || []).forEach(function (id) { activeIds[id] = true; });
    var html = '';
    // 具名函数声明（不是 IIFE）：递归里要引用自身
    function walk(node) {
      var verHtml = node.versions > 1
        ? '<span class="ver">第 ' + node.version + '/' + node.versions + ' 版</span>'
        : '';
      html += convMsgHtml(node, verHtml, !activeIds[node.id]);
      (tree.kids[String(node.id)] || []).forEach(walk);
    }
    (tree.kids['root'] || []).forEach(walk);
    return html || '<div class="empty">没有消息</div>';
  }

  function paintConv() {
    var box = $('#conv-branch');
    if (!box) {
      return;
    }
    var tree = convTree();
    var c = state.convData || {};

    var branchCount = 0;
    tree.nodes.forEach(function (n) { if ((n.versions || 1) > 1) { branchCount++; } });
    var rootCount = (tree.kids['root'] || []).length;
    var hints = [];
    if (branchCount) {
      hints.push('含 ' + branchCount + ' 条带版本的消息：同一父节点下的多条就是「重新生成」出的多个版本');
    }
    if (rootCount > 1) {
      hints.push('该会话有 ' + rootCount + ' 条根消息（各自独立起头的分支）');
    }
    if (hints.length) {
      hints.push(state.convAll
        ? '当前展开全部分支，压暗的是不在当前分支上的消息'
        : '点 ‹ › 切换版本，或用下方按钮展开全部分支');
    }
    var head = hints.length ? '<div class="branchhint">' + hints.join('；') + '。</div>' : '';

    var scroll = box.scrollTop;
    box.innerHTML = head + (state.convAll ? renderBranchAll(tree) : renderBranchPath(tree));
    box.scrollTop = scroll;

    // 正文里可能有公式：KaTeX 就绪后把已插入的节点渲染掉。
    // 只在 Markdown 模式下跑 —— 原文模式里 \( \) 仍是可见字符，
    // 照样会被 auto-render 转成公式，那就失去「看原文」的意义了。
    if (state.convMd) {
      ensureKatex(function () { if (state.convMd) { renderMathIn(box); } });
    }

    $$('#conv-branch .att-img').forEach(function (a) {
      a.onclick = function (e) {
        e.preventDefault();
        var img = $('#lightbox-img');
        img.src = a.getAttribute('href');
        $('#lightbox').classList.remove('hide');
      };
    });

    $$('#conv-branch .vnav').forEach(function (btn) {
      btn.onclick = function (e) {
        e.preventDefault();
        var pk = btn.getAttribute('data-pk');
        var i = parseInt(btn.getAttribute('data-i'), 10);
        var d = parseInt(btn.getAttribute('data-d'), 10);
        var peers = tree.kids[pk] || [];
        var next = peers[i + d];
        if (!next) {
          return;
        }
        state.convPick = state.convPick || {};
        state.convPick[pk] = next.id;
        paintConv();
      };
    });
  }

  function openConv(id) {
    api('/conversations/' + encodeURIComponent(id)).then(function (c) {
      state.convData = c;
      state.convActive = (c.messages || []).map(function (m) { return m.id; });
      state.convPick = {};
      state.convAll = false;
      var kv = '<div class="kv">' +
        '<div class="k">标题</div><div>' + esc(c.title || '（无标题）') + '</div>' +
        '<div class="k">会话 ID</div><div>' + esc(c.id) + '</div>' +
        '<div class="k">用户</div><div>' + esc(c.email || c.user_id) + '</div>' +
        '<div class="k">模型</div><div>' + esc(c.model || '—') + '</div>' +
        '<div class="k">Token</div><div>输入 ' + num(c.tokens_in) + ' · 输出 ' + num(c.tokens_out) +
        ' · 合计 ' + num(c.tokens_in + c.tokens_out) + '</div>' +
        '<div class="k">时间</div><div>' + fmtTime(c.created_at) + ' → ' + fmtTime(c.updated_at) + '</div>' +
        '</div>';

      openModal('会话详情', kv + '<div id="conv-branch"></div>',
        '<button id="m-md">' + (state.convMd ? '看原文' : 'Markdown 渲染') + '</button>' +
        '<button id="m-all">显示全部分支</button>' +
        '<button class="danger" id="m-delc">删除会话</button>');
      paintConv();

      // 渲染是默认；排查时切到原文能看到模型原始输出（星号、表格管道符等）
      $('#m-md').onclick = function () {
        state.convMd = !state.convMd;
        this.textContent = state.convMd ? '看原文' : 'Markdown 渲染';
        paintConv();
      };

      $('#m-all').onclick = function () {
        state.convAll = !state.convAll;
        this.textContent = state.convAll ? '只看当前分支' : '显示全部分支';
        paintConv();
      };

      $('#m-delc').onclick = function () {
        if (!confirm('删除该会话及其全部消息？不可恢复。')) return;
        api('/conversations/' + encodeURIComponent(id), 'DELETE').then(function () {
          toast('已删除'); closeModal(); render();
        }).catch(function (e) { toast('失败：' + e.message); });
      };
    }).catch(function (e) { toast('加载失败：' + e.message); });
  }

  // ---------------------------------------------------------------- 启动

  state.view = currentView();
  var saved = '';
  try { saved = localStorage.getItem(TOKEN_KEY) || ''; } catch (e) {}
  if (saved) {
    state.token = saved;
    api('/overview?days=7').then(function () {
      unlockGate(saved);
    }).catch(function (e) {
      if (e.message !== 'unauthorized' && e.message !== 'disabled') {
        $('#gate-err').textContent = '连接失败：' + e.message;
      }
    });
  } else {
    $('#gate').classList.remove('hide');
  }
})();
</script>
</body>
</html>
